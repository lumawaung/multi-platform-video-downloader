# For the tunnel server (see README, "Sites blocked in the server's country").
# Install as /etc/ssh/sshd_config.d/60-video-tunnel.conf. The tunnel user can
# only open connections to web ports: no shell, no reverse tunnels, and no access
# to services that listen on other ports of that server (databases, panels...).
Match User videotunnel
    AuthenticationMethods publickey
    AllowTcpForwarding local
    PermitOpen *:80 *:443
    PermitListen none
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
